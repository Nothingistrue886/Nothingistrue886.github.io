# ---------------- #
#   Main Configs   #
# ---------------- #
baseurl:
url: https://nothingistrue886.github.io
date_format: "ordinal"
title: 崔作非的博客
subtitle: "Less is More."
description: "疾风劲草"
keywords: 崔作非的博客, Nothingistrue886
timezone: Asia/Shanghai
encoding: "utf-8"
side_bar_repo_limit: 5

# ---------------- #
#      Author      #
# ---------------- #
author: cuizuofei
organization: bilibili
organization_url: https://www.bilibili.com/
github_username: Nothingistrue886
location: Beijing, China
email: czff886@163.com

# ---------------- #
#    Navigation    #
# ---------------- #
navs:
  -
    href: /
    label: 首页

  -
    href: /categories/
    label: 分类

  -
    href: /archives/
    label: 归档

  -
    href: /wiki/
    label: 维基

  -
    href: /links/
    label: 链接

  -
    href: /about/
    label: 关于

# ---------------- #
#       RSS        #
# ---------------- #
subscribe_rss: /feed.xml

# ---------------- #
#      Jekyll      #
# ---------------- #
markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge
paginate: 8
lsi: false
quiet: false
excerpt_separator: "\n\n"
permalink: /:year/:month/:day/:title/
plugins:
  - jekyll-github-metadata
  - rouge
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jemoji
#     - jekyll-html-pipeline
#     - jekyll-mentions
collections:
  wiki:
    output: true
    permalink: /wiki/:path/

repository: Nothingistrue886/Nothingistrue886.github.io

# ---------------- #
#      Comments    #
# ---------------- #
comments_provider: giscus
# https://giscus.app/zh-CN
giscus:
  repo: Nothingistrue886/Nothingistrue886.github.io
  repo_id: MDEwOlJlcG9zaXRvcnkyMjg3ODg4MzA=
  category: Announcements
  category_id: DIC_kwDODaMKXs4DJpfW
  mapping: pathname
  reactions_enabled: "1"
  emit_metadata: "0"
  input_position: bottom
  theme: light
  lang: zh-CN

# ---------------- #
#      Search      #
# ---------------- #
simple_jekyll_search:
  # 是否支持全文搜索
  fulltext: true
  # 最多显示多少条搜索结果
  limit: 10